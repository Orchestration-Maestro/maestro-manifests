apiVersion: maestro.workflow/v1
kind: Workflow
name: scout-and-plan
description: Locate source context and return a plan without editing
chain:
  - agent: scout
    task: "Locate the source context needed for this task: $@"
  - agent: planner
    task: "Plan the changes needed for \"$@\" from this source report: {previous}. Do not implement; return the plan only."

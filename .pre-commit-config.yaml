minimum_prek_version: '0.5.4'
default_stages: [manual]
default_install_hook_types: [pre-commit, pre-merge-commit, commit-msg]
repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: local
    hooks:
      - id: typos
        name: Spelling in code and prose
        language: system
        entry: typos --force-exclude
      - id: editorconfig-checker
        name: Every file against .editorconfig
        language: system
        entry: editorconfig-checker -disable-indent-size
      - id: rumdl
        name: Markdown structure
        language: system
        entry: rumdl check --no-cache --disable MD013,MD041 --config 'MD033.allowed-elements = ["a", "br", "details", "h1", "img", "p", "picture", "source", "strong", "summary"]'
        types: [markdown]
        exclude: '^CHANGELOG\.md$'
      - id: workspace-check
        name: Check staged content
        language: system
        entry: just pre-commit
        stages: [pre-commit, pre-merge-commit]
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: Secrets in the staged change
        language: system
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        stages: [pre-commit, pre-merge-commit]
        pass_filenames: false
      - id: conventional-commit-header
        name: Commit message opens with a conventional header
        language: pygrep
        entry: '\A(?=[^\n]{1,71}\n)(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [a-z][^\n]*\n'
        args: [--negate, --multiline]
        stages: [commit-msg]
      - id: eighty-columns
        name: Commit message lines stay within 80 columns
        language: pygrep
        entry: '^.{81,}$'
        stages: [commit-msg]
